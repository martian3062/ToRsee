components:
  schemas:
    AlertEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rule:
          type: integer
          nullable: true
        rule_name:
          type: string
          readOnly: true
          default: ''
        monitored_target:
          type: integer
          nullable: true
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        severity:
          $ref: '#/components/schemas/AlertEventSeverityEnum'
        title:
          type: string
          maxLength: 256
        message:
          type: string
        payload: {}
        delivered:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_type
      - id
      - message
      - rule_name
      - title
    AlertEventSeverityEnum:
      enum:
      - info
      - medium
      - high
      type: string
      description: |-
        * `info` - Info
        * `medium` - Medium
        * `high` - High
    AlertRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 128
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        conditions: {}
        enabled:
          type: boolean
        monitored_target:
          type: integer
          nullable: true
        cooldown_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        last_triggered:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_type
      - id
      - last_triggered
      - name
      - updated_at
    AuthorizationStatusEnum:
      enum:
      - pending
      - approved
      - suspended
      type: string
      description: |-
        * `pending` - Pending approval
        * `approved` - Approved
        * `suspended` - Suspended
    CensorshipIncident:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        country_code:
          type: string
          maxLength: 8
        asn:
          type: string
          maxLength: 32
        target_domain:
          type: string
          maxLength: 512
        anomaly_type:
          type: string
          maxLength: 128
        measurement_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        failure_rate:
          type: number
          format: double
        reported_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - anomaly_type
      - asn
      - country_code
      - id
      - reported_at
      - target_domain
    CollectionModeEnum:
      enum:
      - bot_webhook
      - approved_public
      - manual
      type: string
      description: |-
        * `bot_webhook` - Telegram Bot webhook
        * `approved_public` - Approved public source
        * `manual` - Manual import
    CorrelationFinding:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        investigation:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/Severity3cdEnum'
          readOnly: true
        supporting_evidence_ids:
          readOnly: true
        entity_ids:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - entity_ids
      - id
      - investigation
      - severity
      - supporting_evidence_ids
      - title
      - updated_at
    DarkWebCrawl:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          maxLength: 1024
        keywords:
          type: string
          maxLength: 512
        monitored_target:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/ProcessingStatusEnum'
          readOnly: true
        routed_via_tor:
          type: boolean
          readOnly: true
        is_onion:
          type: boolean
          readOnly: true
        error:
          type: string
          readOnly: true
        results:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - error
      - id
      - is_onion
      - monitored_target
      - results
      - routed_via_tor
      - status
      - updated_at
      - url
    Document:
