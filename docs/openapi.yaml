components:
  schemas:
    AlertEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rule:
          type: integer
          nullable: true
        rule_name:
          type: string
          readOnly: true
          default: ''
        monitored_target:
          type: integer
          nullable: true
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        severity:
          $ref: '#/components/schemas/AlertEventSeverityEnum'
        title:
          type: string
          maxLength: 256
        message:
          type: string
        payload: {}
        delivered:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_type
      - id
      - message
      - rule_name
      - title
    AlertEventSeverityEnum:
      enum:
      - info
      - medium
      - high
      type: string
      description: |-
        * `info` - Info
        * `medium` - Medium
        * `high` - High
    AlertRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 128
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        conditions: {}
        enabled:
          type: boolean
        monitored_target:
          type: integer
          nullable: true
        cooldown_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        last_triggered:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_type
      - id
      - last_triggered
      - name
      - updated_at
    CensorshipIncident:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        country_code:
