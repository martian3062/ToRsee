services:
  postgres:
    image: timescale/timescaledb-ha:pg18.4-ts2.28.3-all
    container_name: torsy-postgres
    environment:
      POSTGRES_DB: torsy
      POSTGRES_USER: torsy
      POSTGRES_PASSWORD: torsy
    ports:
      - "5432:5432"
    volumes:
      - torsy_pg18_data:/home/postgres/pgdata/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torsy -d torsy"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: torsy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  tor:
    image: dperson/torproxy:latest
    container_name: torsy-tor
    ports:
      - "9050:9050"
      - "9051:9051"
    environment:
      - TOR_NewCircuitPeriod=60
    restart: always

volumes:
  torsy_pg18_data:
