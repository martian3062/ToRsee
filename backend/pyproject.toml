[project]
name = "torsy-backend"
version = "0.1.0"
description = "Django API for ToRsy: The Buddy in the Dark"
requires-python = ">=3.12,<3.15"
dependencies = [
  "celery[redis]>=5.4,<6",
  "django>=5.2,<5.3",
  "django-cors-headers>=4.4,<5",
  "djangorestframework>=3.15,<4",
  "drf-spectacular>=0.28,<1",
  "dj-database-url>=2.2,<3",
  "gunicorn>=23,<24",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "redis>=5,<7",
  "stem>=1.8",
  "exifread>=3.0",
  "dnspython>=2.6",
  "pyod>=3.6.1",
  "beautifulsoup4>=4.12",
  "socksio>=1.0.0",
]

[project.optional-dependencies]
providers = [
  "firecrawl-py>=1.0",
  "groq>=0.11",
  "huggingface-hub>=0.25",
  "pinecone>=5",
  "supabase>=2.7",
]
tabular = [
  "tabpfn>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "pytest-mock>=3.14,<4",
  "ruff>=0.7,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-q"
