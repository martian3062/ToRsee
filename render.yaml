services:
  - type: web
    name: torsy-api
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install uv && uv sync --locked --no-dev
    preDeployCommand: uv run python manage.py migrate --noinput
    startCommand: uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: DATABASE_URL
        fromDatabase:
          name: torsy-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: torsy-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: PROVIDER_MOCK_MODE
        value: "true"
      - key: TELEGRAM_COLLECTION_ENABLED
        value: "false"
      - key: INTELLIGENCE_LIVE_ENABLED
        value: "false"

  - type: worker
    name: torsy-worker
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install uv && uv sync --locked --no-dev
    startCommand: uv run celery -A config worker --beat --loglevel=INFO --concurrency=1
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        fromService:
          type: web
          name: torsy-api
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: torsy-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: torsy-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: PROVIDER_MOCK_MODE
        value: "true"
      - key: TELEGRAM_COLLECTION_ENABLED
        value: "false"
      - key: INTELLIGENCE_LIVE_ENABLED
        value: "false"

  - type: keyvalue
    name: torsy-redis
    region: singapore
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: torsy-postgres
    region: singapore
    plan: basic-256mb
    ipAllowList: []
